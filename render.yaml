services:
  - name: shadow-bot
    type: web
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: shadow-bot-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: REMOVEBG_API_KEY
        sync: false
      - key: PHOTOROOM_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: PAIRING_NUMBER
        sync: false

databases:
  - name: shadow-bot-db
    plan: free
